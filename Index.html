 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимное сообщение 🔒</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            padding: 50px;
            cursor: default;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #006699;
        }
        .warning {
            font-size: 12px;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 Анонимное сообщение</h1>
        <p>Кто-то отправил вам секретное сообщение. Нажмите кнопку ниже, чтобы открыть его.</p>
        <button class="btn" id="showMessage">Показать сообщение</button>
        <p class="warning">Внимание: сообщение может содержать неожиданный контент.</p>
    </div>

    <!-- Скрытые элементы для скримера -->
    <audio id="scarySound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-horror-laugh-566.mp3" type="audio/mpeg">
    </audio>
    <img id="scaryImage" src="https://i.imgur.com/XYZ1234.jpg" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 9999;">

    <script>
        document.getElementById('showMessage').addEventListener('click', function() {
            const sound = document.getElementById('scarySound');
            const image = document.getElementById('scaryImage');
            
            // Воспроизводим звук на полной громкости
            sound.volume = 1.0;
            sound.play();
            
            // Показываем изображение (если нужно)
            image.style.display = 'block';
            
            // Через 3 секунды скрываем изображение
            setTimeout(() => {
                image.style.display = 'none';
            }, 3000);
        });
    </script>
</body>
</html>
